aid: kojo
name: Kojo
description: >-
  Kojo (formerly Agora, kojo.app) is a construction materials management and
  procurement platform built for specialty trade contractors — electrical,
  mechanical, concrete, drywall, flooring, and roofing. It connects the field,
  the purchasing team, the warehouse, the prefab shop, and accounting into a
  single materials workflow covering requesting, sourcing, purchasing,
  receiving, tool tracking, invoice matching, and payment. Kojo publishes no
  self-service developer API or OpenAPI; its machine-to-machine surface is a
  partner-gated Vendor Integration Portal that exchanges ANSI ASC X12 EDI
  documents (810/840/843/850/855) with supplier ERPs, ingests catalog, pricing,
  and branch inventory files over scheduled email feeds, and ships connectors
  for sixteen ERP and project-management systems including Procore, Sage,
  Acumatica, CMiC, Viewpoint Vista, and Autodesk Construction Cloud.
